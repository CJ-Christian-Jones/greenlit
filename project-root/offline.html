<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0910" />
    <title>GREENLIT Arcade — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background: #09070d;
        color: #f7f1ff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        border: 1px solid #40364c;
        background: #17131f;
        border-radius: 16px;
        padding: 28px 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        color: #ffd064;
      }
      p {
        margin: 0 0 18px;
        color: #aaa0b8;
        line-height: 1.5;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        background: #a56dff;
        color: #09070d;
        font-weight: 600;
        min-height: 44px;
        min-width: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        GREENLIT Arcade needs a connection to load this page the first time.
        Once it's loaded once, the app shell and bundled catalog work without
        one — live TMDB search still needs a network.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
